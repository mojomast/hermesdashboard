                <div class="card" style="margin-bottom: 1rem;">

                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <select id="new-secret-key" style="flex: 1; min-width: 200px; padding: 0.6rem; background: var(--input-bg); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text);">
