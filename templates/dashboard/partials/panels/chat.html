        <!-- Chat Panel -->
        <div class="panel active" id="chat-panel">
            <div class="chat-layout">
                <aside class="chat-room-rail" id="chat-room-rail" aria-label="Chat rooms">
                    <div class="chat-room-rail-header">
                        <span class="chat-room-rail-label">Rooms</span>
                        <button class="chat-room-rail-toggle" id="chat-room-rail-toggle" type="button" aria-expanded="false" aria-controls="chat-room-list" aria-label="Expand chat room rail" title="Expand chat room rail"><span aria-hidden="true">&rsaquo;</span></button>
                    </div>
                    <div id="chat-room-list" class="chat-room-list">
                        <button class="chat-room-tab active" type="button" data-room-id="main" onclick="switchChatRoom('main')"><span class="chat-room-mark main"></span><span><strong>Main</strong><small>Default Hermes profile</small></span></button>
                        <button class="chat-room-tab" type="button" data-room-id="shared" onclick="switchChatRoom('shared')"><span class="chat-room-mark shared"></span><span><strong>All Bots Room</strong><small>Shared profile roundtable</small></span></button>
                    </div>
                    <div id="terminal-dock" class="terminal-dock" role="toolbar" aria-label="Open terminals" hidden></div>
                </aside>
                <div class="chat-main">
                    <header class="chat-room-heading">
                        <div class="chat-room-heading-identity">
                            <span id="chat-room-avatar" class="bot-avatar bot-avatar-heading" aria-hidden="true"><span class="bot-avatar-initial">H</span></span>
                            <div>
                            <div class="chat-room-eyebrow" id="chat-room-eyebrow">MAIN PROFILE</div>
                            <h2 id="chat-room-title">Hermes</h2>
                            <p id="chat-room-subtitle">Your default dashboard conversation and session.</p>
                            </div>
                        </div>
                        <div class="chat-run-status" id="chat-run-status">
                            <details class="chat-run-status-details" id="chat-run-status-details">
                                <summary class="chat-run-status-trigger">
                                    <span class="chat-working-spark" aria-hidden="true"><span></span><span></span><span></span></span>
                                    <span id="chat-run-status-title">Hermes is working</span>
                                </summary>
                                <div class="chat-run-status-drawer">
                                    <div class="chat-run-status-text" id="chat-run-status-text">A chat run is in progress.</div>
                                    <div class="chat-run-status-meta" id="chat-run-status-meta"></div>
                                    <div class="interrupt-status-msg" id="interrupt-status-msg" hidden></div>
                                </div>
                            </details>
                            <div class="chat-run-status-actions">
                                <button class="btn emergency-stop-btn" type="button" id="chat-run-stop-btn" onclick="requestInterrupt(getActiveRun()?.sessionId || null, getActiveRun()?.runId || null)">Stop main agent</button>
                                <button class="btn" type="button" id="chat-run-reattach-btn" onclick="reattachActiveRunSession()">Reattach</button>
                                <button class="btn" type="button" id="chat-run-resume-btn" onclick="resumeActiveRunFromBanner()">Follow stream</button>
                            </div>
                        </div>
                        <div class="chat-room-heading-actions">
                            <span class="chat-room-profile" id="chat-room-profile">default</span>
                            <button class="btn debug-reopen" id="debug-reopen" type="button" onclick="toggleDebug()">Show Debug</button>
                        </div>
                    </header>
                    <div class="chat-container" id="chat"></div>
                    <div id="chat-attachment-preview-bar" class="chat-attachment-preview-bar" aria-live="polite"></div>
                    <div class="input-container">
                        <input id="chat-image-input" type="file" accept="image/*" multiple hidden>
                        <button id="chat-image-btn" class="chat-image-btn" type="button" title="Attach images" aria-label="Attach images">Image</button>
                        <textarea id="user-input" placeholder="Message Hermes..." rows="1"></textarea>
                        <div class="chat-input-actions">
                            <button id="send-btn" type="button">Send</button>
                            <button class="btn compact-chat-btn" id="compact-chat-btn" type="button" onclick="compactCurrentChat()" disabled>Compact</button>
                            <button class="clear-btn" type="button" onclick="clearChat()">Clear Chat</button>
                        </div>
                    </div>
                    <div class="chat-context" id="chat-context-panel" aria-label="Chat context usage" hidden>
                        <div id="chat-context-summary"></div>
                    </div>
                </div>
                <div class="debug-panel" id="debug-panel">
                    <div class="debug-header">
                        <h3><span class="indicator"></span> Debug Log</h3>
                        <div class="debug-actions">
                            <button onclick="clearLog()">Clear</button>
                            <button onclick="toggleDebug()">Hide</button>
                        </div>
                    </div>
                    <div class="debug-log" id="debug-log"></div>
                </div>
            </div>
        </div>
