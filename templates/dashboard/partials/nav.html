    <div class="header">
        <div class="logo">Hermes <span>Dashboard</span></div>
        <div style="display:flex;align-items:center;gap:1rem;">
            <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">&#9776;</button>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme">
                <span id="theme-icon">&#9790;</span>
            </button>
            <div class="dashboard-settings-wrapper">
                <button class="dashboard-settings-button" id="dashboard-settings-button" onclick="toggleDashboardSettings(event)" title="Dashboard settings" aria-haspopup="true" aria-expanded="false">
                    <span aria-hidden="true">&#9881;</span><span class="sr-only">Dashboard settings</span>
                </button>
                <div class="dashboard-settings-menu" id="dashboard-settings-menu" role="dialog" aria-label="Dashboard settings">
                    <h3>Dashboard Settings</h3>
                    <p>Reload this dashboard after code changes and choose which tabs appear in the top and mobile navigation. Tab visibility is saved in this browser.</p>
                    <div class="dashboard-settings-actions">
                        <button class="btn" type="button" onclick="hardRefreshDashboard()">Reload Dashboard</button>
                        <button class="btn" type="button" onclick="openUpdateInstructions()">Update Instructions</button>
                        <button class="btn" type="button" onclick="startDashboardAutoUpdate()">Auto Update</button>
                        <button class="btn" type="button" onclick="resetDashboardTabs()">Show All Tabs</button>
                    </div>
                    <h3>Visible Tabs</h3>
                    <p>Chat stays visible so there is always a safe fallback tab.</p>
                    <div class="dashboard-tab-settings" id="dashboard-tab-settings"></div>
                </div>
            </div>
            <div class="status-bar">
                <span><span class="dot"></span> <span id="current-model">Loading...</span></span>
                <span id="current-personality">Personality: --</span>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-panel="chat">Chat</button>
        <button class="tab" data-panel="message-board">Message Board</button>
        <button class="tab" data-panel="config">Config</button>
        <button class="tab" data-panel="secrets">Secrets</button>
        <button class="tab" data-panel="sessions">Sessions</button>
        <button class="tab" data-panel="agent-observability">Agent Ops</button>
        <button class="tab" data-panel="memory">Memory</button>
        <button class="tab" data-panel="skills">Skills</button>
        <button class="tab" data-panel="games">Games</button>
        <button class="tab" data-panel="diagnostics">Diagnostics</button>
        <button class="tab" data-panel="dnd">Campaigns</button>
        <button class="tab" data-panel="self-improvement">Self-Improvement</button>
        <button class="tab" data-panel="autonomous-development">Autonomous Development</button>
        <button class="tab" data-panel="scrolls">Vesuvius AutoResearch</button>
        <button class="tab" data-panel="cron">Cron</button>
        <button class="tab" data-panel="schedule">Schedule</button>
        <button class="tab" data-panel="graph">Graph</button>
    </div>

    <div class="breadcrumbs" id="breadcrumbs"></div>
